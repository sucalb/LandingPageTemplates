<svg viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE3CC"/>
      <stop offset="1" stop-color="#DFC9A3"/>
    </linearGradient>
    <linearGradient id="floor2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8926A"/>
      <stop offset="1" stop-color="#96714B"/>
    </linearGradient>
    <radialGradient id="glow2a" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE7B0" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#B0552F" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#B0552F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="700" height="380" fill="url(#wall2)"/>
  <rect y="380" width="700" height="180" fill="url(#floor2)"/>
  <rect y="380" width="700" height="6" fill="#6B4A2F" opacity=".4"/>

  <!-- tranh tường trang trí -->
  <rect x="500" y="60" width="150" height="110" rx="3" fill="none" stroke="#6B4A2F" stroke-width="5" opacity=".4"/>
  <path d="M515 150 l35 -45 25 30 20 -18 30 33" fill="none" stroke="#77836C" stroke-width="3" opacity=".4"/>

  <!-- cụm đèn thả trên bàn ăn -->
  <g filter="url(#soft2)"><circle cx="330" cy="150" r="110" fill="url(#glow2a)"/></g>
  <g stroke="#6B4A2F" stroke-width="2.5" opacity=".75">
    <line x1="220" y1="20" x2="220" y2="130"/>
    <line x1="330" y1="10" x2="330" y2="165"/>
    <line x1="440" y1="24" x2="440" y2="118"/>
  </g>
  <g fill="#C99A5B" stroke="#8A6A45" stroke-width="1.5">
    <ellipse cx="220" cy="152" rx="46" ry="34"/>
    <ellipse cx="330" cy="188" rx="56" ry="42"/>
    <ellipse cx="440" cy="140" rx="40" ry="30"/>
  </g>
  <g fill="#FBEFD6" opacity=".85">
    <ellipse cx="220" cy="145" rx="14" ry="10"/>
    <ellipse cx="330" cy="178" rx="17" ry="12"/>
    <ellipse cx="440" cy="134" rx="12" ry="9"/>
  </g>

  <!-- bàn ăn dài + ghế -->
  <rect x="120" y="400" width="460" height="16" rx="4" fill="#5C4530"/>
  <rect x="140" y="416" width="14" height="70" fill="#5C4530"/>
  <rect x="546" y="416" width="14" height="70" fill="#5C4530"/>
  <g fill="#8A6A45" opacity=".85">
    <rect x="170" y="430" width="46" height="50" rx="6"/>
    <rect x="240" y="430" width="46" height="50" rx="6"/>
    <rect x="414" y="430" width="46" height="50" rx="6"/>
    <rect x="484" y="430" width="46" height="50" rx="6"/>
  </g>
  <ellipse cx="330" cy="404" rx="130" ry="10" fill="#3F2E1E" opacity=".25"/>

  <!-- bình hoa nhỏ trên bàn -->
  <ellipse cx="330" cy="398" rx="9" ry="7" fill="#77836C"/>
  <path d="M330 398 q-10 -22 -2 -34 M330 398 q10 -20 4 -32" stroke="#77836C" stroke-width="2.5" fill="none"/>

  <!-- chậu cây góc trái -->
  <path d="M60 380 q-16 -34 4 -60 q22 24 6 60z" fill="#77836C" opacity=".75"/>
  <path d="M60 380 q10 -40 -8 -66 q-18 28 0 66z" fill="#8FA085" opacity=".75"/>
  <rect x="46" y="376" width="30" height="24" rx="3" fill="#6B4A2F" opacity=".7"/>

  <text x="350" y="545" text-anchor="middle" font-family="Arial" font-size="15" fill="#6B4A2F" opacity=".45">Ảnh minh hoạ — thay bằng ảnh không gian thật</text>
</svg>
