<svg viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1E6D2"/>
      <stop offset="1" stop-color="#E3D2B4"/>
    </linearGradient>
    <linearGradient id="floor1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7A97D"/>
      <stop offset="1" stop-color="#A8845A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE7B0" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#F4C572" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#F4C572" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rug1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9C4B32"/>
      <stop offset="1" stop-color="#7C3A26"/>
    </linearGradient>
    <filter id="soft1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="700" height="392" fill="url(#wall1)"/>
  <rect y="392" width="700" height="168" fill="url(#floor1)"/>
  <rect y="392" width="700" height="6" fill="#8A6A45" opacity=".4"/>

  <!-- cửa sổ ánh sáng hắt vào -->
  <rect x="0" y="0" width="230" height="392" fill="#fff" opacity=".05"/>
  <rect x="18" y="26" width="190" height="330" rx="4" fill="none" stroke="#8A6A45" stroke-width="5" opacity=".35"/>
  <line x1="113" y1="26" x2="113" y2="356" stroke="#8A6A45" stroke-width="4" opacity=".3"/>
  <line x1="18" y1="191" x2="208" y2="191" stroke="#8A6A45" stroke-width="4" opacity=".3"/>

  <!-- thảm -->
  <ellipse cx="430" cy="500" rx="220" ry="42" fill="url(#rug1)" opacity=".85"/>
  <ellipse cx="430" cy="500" rx="220" ry="42" fill="none" stroke="#F4E3B8" stroke-width="2" opacity=".4"/>

  <!-- cụm đèn thả trần -->
  <g filter="url(#soft1)" opacity=".9"><circle cx="470" cy="170" r="95" fill="url(#glow1)"/></g>
  <g stroke="#8A6A45" stroke-width="2.5" opacity=".7">
    <line x1="420" y1="30" x2="420" y2="128"/>
    <line x1="470" y1="20" x2="470" y2="150"/>
    <line x1="520" y1="34" x2="520" y2="122"/>
    <line x1="560" y1="50" x2="560" y2="108"/>
  </g>
  <g fill="#FBEFD6" stroke="#C99A5B" stroke-width="1.5">
    <ellipse cx="420" cy="140" rx="26" ry="20"/>
    <ellipse cx="470" cy="164" rx="32" ry="24"/>
    <ellipse cx="520" cy="134" rx="24" ry="18"/>
    <ellipse cx="560" cy="118" rx="18" ry="14"/>
  </g>
  <g fill="#F4C572" opacity=".8">
    <circle cx="420" cy="140" r="9"/><circle cx="470" cy="164" r="11"/>
    <circle cx="520" cy="134" r="8"/><circle cx="560" cy="118" r="6"/>
  </g>

  <!-- kệ console + tranh treo tường -->
  <rect x="40" y="330" width="150" height="14" rx="4" fill="#6B4A2F"/>
  <rect x="52" y="270" width="30" height="60" fill="#8A6A45" opacity=".55"/>
  <rect x="60" y="220" width="56" height="42" rx="3" fill="none" stroke="#6B4A2F" stroke-width="4" opacity=".55"/>
  <ellipse cx="150" cy="315" rx="10" ry="16" fill="#77836C" opacity=".7"/>
  <path d="M150 315 q-14 -26 0 -46 q14 20 0 46" fill="#8FA085" opacity=".7"/>

  <!-- ghế bành góc phải -->
  <path d="M600 470 v-46 q0 -22 22 -22 h30 q22 0 22 22 v46 z" fill="#B0552F" opacity=".55"/>
  <rect x="592" y="466" width="90" height="16" rx="4" fill="#8A4020" opacity=".55"/>

  <text x="350" y="545" text-anchor="middle" font-family="Arial" font-size="15" fill="#6B4A2F" opacity=".45">Ảnh minh hoạ — thay bằng ảnh không gian thật</text>
</svg>
